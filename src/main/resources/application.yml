spring:
  application:
    name: elorps
  jpa:
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
  jooq:
    sql-dialect: postgres

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.tokoizinistri.elorps: DEBUG
    org.springframework.security: INFO